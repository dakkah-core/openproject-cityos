# cityos-helm-manifest.yml
# Canonical configuration for CityOS HELM — applied idempotently by foundation plugin seeder.
schemaVersion: cityos-helm-config.v1

# ── Work-Package Types ────────────────────────────────────
types:
  - name: Task
    color: "#3498DB"
    position: 1
    is_default: true
  - name: Milestone
    color: "#9B59B6"
    position: 2
    is_milestone: true
  - name: Workstream
    color: "#1ABC9C"
    position: 3
  - name: Risk
    color: "#E74C3C"
    position: 4
  - name: Decision
    color: "#F39C12"
    position: 5
  - name: Evidence
    color: "#2ECC71"
    position: 6
  - name: Gate
    color: "#E67E22"
    position: 7
  - name: ReleaseGate
    color: "#C0392B"
    position: 8

# ── Execution Statuses ─────────────────────────────────────
# Done = HELM execution complete. Does NOT mean owner-approved or production-proven.
statuses:
  - name: Planned
    is_default: true
    is_closed: false
    color: "#95A5A6"
  - name: Ready
    is_default: false
    is_closed: false
    color: "#3498DB"
  - name: In Progress
    is_default: false
    is_closed: false
    color: "#2ECC71"
  - name: In Review
    is_default: false
    is_closed: false
    color: "#F39C12"
  - name: Verification
    is_default: false
    is_closed: false
    color: "#9B59B6"
  - name: Blocked
    is_default: false
    is_closed: false
    color: "#E74C3C"
  - name: Done
    is_default: false
    is_closed: true
    color: "#1ABC9C"
  - name: Cancelled
    is_default: false
    is_closed: true
    color: "#7F8C8D"

# ── CityOS Roles ──────────────────────────────────────────
roles:
  - program-planner
  - builder-agent
  - reviewer-agent
  - tester-agent
  - security-agent
  - devops-agent
  - auditor
  - owner-recorder

# ── Workflow Rules ────────────────────────────────────────
# Role-based transitions with Separation of Duties
workflows:
  type_defaults:
    allowed_transitions:
      Planned: [Ready, Cancelled]
      Ready: [In Progress, Cancelled]
      In Progress: [In Review, Blocked, Cancelled]
      In Review: [In Progress, Verification, Blocked, Cancelled]
      Verification: [In Progress, Done, Blocked, Cancelled]
      Blocked: [In Progress, Cancelled]
      Done: []
      Cancelled: []

  sod_constraints:
    - "builder-agent cannot transition to In Review on own work packages"
    - "reviewer-agent cannot transition own work packages to Verification"
    - "No agent can modify governance projections"
    - "Only sync identity can write to cityos_scope_bindings"
    - "Only sync identity can write to cityos_governance_projections"
    # Expansion-pack-01 §3 — DWOS approval boundary (2026-08-06)
    - "HELM must never self-approve — approval_verified_at is forbidden"
    - "StrategicPlan#baseline! must publish DWOS command, never write approval_ref"
    - "All strategy records require immutable stable_id; title-based reconciliation is prohibited"
    - "Strategy/investment reads require explicit project/portfolio role membership"
