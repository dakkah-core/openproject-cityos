name: CityOS HELM CI
on:
  push:
    branches: [main, 'cityos/*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CityOS HELM image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cityos
          tags: ghcr.io/dakkah-core/cityos-helm:edge
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate manifest
        run: |
          docker run --rm ghcr.io/dakkah-core/cityos-helm:edge \
            cat /app/config/cityos-helm-manifest.yml | \
            python3 -c "import sys,yaml; yaml.safe_load(sys.stdin); print('Manifest valid')"

      - name: Check GPLv3 compliance
        run: |
          docker run --rm ghcr.io/dakkah-core/cityos-helm:edge \
            test -f /app/NOTICE.md && echo "NOTICE.md present" || (echo "MISSING NOTICE.md" && exit 1)
          docker run --rm ghcr.io/dakkah-core/cityos-helm:edge \
            test -f /app/LICENSE.txt && echo "LICENSE.txt present" || echo "WARNING: LICENSE.txt not found"

      - name: Check plugin registration
        run: |
          docker run --rm ghcr.io/dakkah-core/cityos-helm:edge \
            ls /app/modules/cityos-foundation/lib/ && echo "Foundation plugin present"
          docker run --rm ghcr.io/dakkah-core/cityos-helm:edge \
            ls /app/modules/cityos-identity/lib/ && echo "Identity plugin present"
          docker run --rm ghcr.io/dakkah-core/cityos-helm:edge \
            ls /app/modules/cityos-governance/lib/ && echo "Governance plugin present"
          docker run --rm ghcr.io/dakkah-core/cityos-helm:edge \
            ls /app/modules/cityos-portfolio/lib/ && echo "Portfolio plugin present"
          docker run --rm ghcr.io/dakkah-core/cityos-helm:edge \
            ls /app/modules/cityos-strategy/lib/ && echo "Strategy plugin present"

  push:
    name: Push Image
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cityos
          tags: |
            ghcr.io/dakkah-core/cityos-helm:17.6.0.1
            ghcr.io/dakkah-core/cityos-helm:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
